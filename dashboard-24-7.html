<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIC 7 AGENTS LIVE</title>
<style>body{background:#080808;color:#eee;font-family:system-ui;padding:10px}.c{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin:8px 0}.gold{color:#f5d547;font-size:32px;font-weight:900}.gr{color:#00ff88;font-weight:800}.red{color:#ff5a5a} table{width:100%;font-size:13px;border-collapse:collapse} th{opacity:.5;text-align:left;padding:4px} td{padding:6px 4px;border-top:1px solid #222}.badge{padding:2px 8px;border-radius:10px;font-size:11px}.LONG{background:#00ff8822;color:#00ff88}.SHORT{background:#ff5a5a22;color:#ff5a5a}</style></head><body>
<div class="c"><div style="opacity:.6">LIVE CAPITAL - 7 AGENTS TRAINING</div><div id="cap" class="gold">$300.0000</div><div id="sub" class="gr">loading...</div><div id="ls" style="margin-top:6px;font-size:13px"></div></div>
<div class="c"><div id="pnl" class="gold" style="color:#00ff88">+$0.00</div><div style="display:flex;gap:12px;font-size:14px"><div>LONG: <span id="pll" class="gr">+$0</span> (<span id="lt">0</span>)</div><div>SHORT: <span id="pls" class="red">+$0</span> (<span id="st">0</span>)</div></div></div>
<div class="c"><div style="opacity:.6;margin-bottom:6px">ALL 7 AGENTS - SHORT / LONG P&L - REAL DATA TRAINED</div><table><thead><tr><th>Agent</th><th>WR</th><th>P&L</th><th>LONG</th><th>SHORT</th></tr></thead><tbody id="agents"></tbody></table></div>
<div class="c"><div id="last">Last: -</div><div id="tm" style="opacity:.5;font-size:12px"></div></div>
<script>
async function go(){
 try{
  const j=await (await fetch('dashboard_data.json?'+Date.now(),{cache:'no-store'})).json();
  document.getElementById('cap').textContent='$'+j.capital.toFixed(4);
  document.getElementById('sub').textContent='+'+j.daily.toFixed(4)+' • '+Math.round(j.wins/(j.trades||1)*100)+'% WR • '+j.trades+' trades • '+j.last_agent;
  document.getElementById('pll').textContent='$'+j.pnl_long.toFixed(2); document.getElementById('lt').textContent=j.long_trades;
  document.getElementById('pls').textContent='$'+j.pnl_short.toFixed(2); document.getElementById('st').textContent=j.short_trades;
  document.getElementById('pnl').textContent=(j.daily>=0?'+$':'-$')+Math.abs(j.daily).toFixed(2);
  document.getElementById('last').innerHTML='<span class="badge '+(j.last_signal||'LONG')+'">'+(j.last_signal||'LONG')+'</span> '+j.last_coin+' • '+j.last_agent+' • Order #'+(12596+j.trades);
  document.getElementById('tm').textContent=new Date(j.time).toLocaleTimeString()+' LIVE - Trained on real Binance klines';
  let html='';
  for(let name in j.agents){
    const a=j.agents[name]; const tot=a.wins+a.losses; const wr=tot?Math.round(a.wins/tot*100):0;
    html+='<tr><td><b>'+name+'</b></td><td>'+wr+'% '+a.wins+'W/'+a.losses+'L</td><td class="'+(a.pnl>=0?'gr':'red')+'">$'+a.pnl.toFixed(2)+'</td><td><span class="gr">'+a.long_w+'W/'+a.long_l+'L</span><br>$'+a.pnl_long.toFixed(2)+'</td><td><span class="red">'+a.short_w+'W/'+a.short_l+'L</span><br>$'+a.pnl_short.toFixed(2)+'</td></tr>';
  }
  document.getElementById('agents').innerHTML=html;
 }catch(e){ document.getElementById('tm').textContent='waiting for main.py... '+e.message }
}
setInterval(go,2000); go();
</script></body></html>
